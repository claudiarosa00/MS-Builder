<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSBuilder — Creative Specs Builder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!--
  ============================================
  1. CABEÇALHO
  ============================================
  -->
  <header class="cabecalho">
    <img class="logo-havas" src="assets/havas-logo.png" alt="Havas Media Network">
    <div class="cabecalho-texto">
      <h1><span class="titulo-acento">CS</span>Builder</h1>
      <p class="subtitulo" data-i18n="subtitulo">Creative Specs Builder</p>
    </div>
    <div class="seletor-idioma">
      <label for="campoIdioma" data-i18n="labelIdioma">Idioma</label>
      <select id="campoIdioma">
        <option value="pt">Português</option>
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
      </select>
    </div>
  </header>

  <!--
  ============================================
  2. TABS (Construir Pedido / Biblioteca de Formatos)
  As duas "vistas" da app: uma para montar o pedido de
  materiais (com seleção e exportação), outra só para
  consultar todos os formatos e specs, sem selecionar nada.
  ============================================
  -->
  <div class="barra-tabs" role="tablist">
    <button type="button" class="tab-botao" data-tab="construir" aria-selected="true" data-i18n="tabConstruir">Construir Pedido</button>
    <button type="button" class="tab-botao" data-tab="specs" aria-selected="false" data-i18n="tabSpecs">Biblioteca de Formatos</button>
  </div>

  <!--
  ============================================
  3. LAYOUT PRINCIPAL (índice lateral + conteúdo)
  O índice lateral lista os publishers da tab que está
  aberta no momento — clicar salta direto para essa secção,
  em vez de ser preciso percorrer a lista toda a scroll.
  ============================================
  -->
  <div class="layout-app">

    <nav id="indicePublishers" class="indice-publishers" data-i18n-aria-label="indiceAriaLabel" aria-label="Índice de publishers"></nav>

    <div class="conteudo-principal">

      <!--
      ============================================
      3.0 BARRA DE FILTROS
      Partilhada pelas duas tabs: filtra sempre a que
      estiver aberta no momento (pesquisa por nome +
      filtro por categoria).
      ============================================
      -->
      <div class="barra-filtros">
        <input type="text" id="campoPesquisa" data-i18n-placeholder="placeholderPesquisa" placeholder="Pesquisar formato ou publisher...">
        <div class="filtros-categoria">
          <button type="button" class="filtro-categoria ativo" data-categoria="todas" data-i18n="filtroTodas">Todas</button>
          <button type="button" class="filtro-categoria" data-categoria="Social Media" data-i18n="filtroSocialMedia">Social Media</button>
          <button type="button" class="filtro-categoria" data-categoria="Compra Direta" data-i18n="filtroCompraDireta">Compra Direta</button>
          <button type="button" class="filtro-categoria" data-categoria="Google ou Search" data-i18n="filtroGoogleSearch">Google ou Search</button>
        </div>
        <button type="button" id="botaoLimparFiltros" class="botao-limpar" data-i18n="botaoLimparFiltros">Limpar filtros</button>
      </div>

      <!--
      ============================================
      3.1 TAB "CONSTRUIR PEDIDO"
      ============================================
      -->
      <section id="tabConstruir" class="painel-tab">

        <section class="dados-campanha">
          <div class="campo">
            <label for="campoCompanhia"><span data-i18n="labelCompanhia">Companhia</span> <span class="marca-obrigatorio">*</span></label>
            <select id="campoCompanhia" required>
              <option value="" disabled selected data-i18n="opcaoSelecionar">— Selecionar —</option>
              <option value="Havas Media">Havas Media</option>
              <option value="Arena Media">Arena Media</option>
            </select>
          </div>
          <div class="campo">
            <label for="campoCliente" data-i18n="labelCliente">Cliente</label>
            <input type="text" id="campoCliente" data-i18n-placeholder="placeholderCliente" placeholder="Nome do cliente">
          </div>
          <div class="campo">
            <label for="campoCampanha" data-i18n="labelCampanha">Campanha</label>
            <input type="text" id="campoCampanha" data-i18n-placeholder="placeholderCampanha" placeholder="Nome da campanha">
          </div>
        </section>

        <!--
        ============================================
        3.1.1 SELETOR DE OBJETIVO (Awareness / Consideration / Conversion)
        Cada objetivo tem a sua própria seleção de formatos: o mesmo
        formato pode ser pedido em mais que um objetivo (ex.: Single
        Image para Awareness E para Conversion), porque a agência trata
        essas criatividades/copies como pedidos distintos mesmo quando
        as specs técnicas são iguais.
        ============================================
        -->
        <section class="seletor-objetivo">
          <label data-i18n="labelObjetivo">Objetivo</label>
          <div class="objetivos-botoes" role="tablist">
            <button type="button" class="objetivo-botao ativo" data-objetivo="awareness">
              <span data-i18n="objetivoAwareness">Awareness</span> <span class="objetivo-contagem" data-contagem="awareness"></span>
            </button>
            <button type="button" class="objetivo-botao" data-objetivo="consideration">
              <span data-i18n="objetivoConsideration">Consideration</span> <span class="objetivo-contagem" data-contagem="consideration"></span>
            </button>
            <button type="button" class="objetivo-botao" data-objetivo="conversion">
              <span data-i18n="objetivoConversion">Conversion</span> <span class="objetivo-contagem" data-contagem="conversion"></span>
            </button>
          </div>
        </section>

        <p id="resumoCampanha" class="resumo-campanha"></p>

        <div class="barra-fixa">
          <aside id="resumoSelecao" class="resumo-selecao"></aside>
          <div id="areaExportar" class="area-exportar">
            <button id="botaoExportar" type="button" disabled data-i18n="botaoExportar">Exportar para Excel</button>
            <button id="botaoLimparSelecao" type="button" class="botao-limpar" disabled data-i18n="botaoLimparSelecao">Limpar seleção</button>
          </div>
        </div>

        <section id="areaEstado" class="area-estado"></section>

        <p id="semResultadosConstruir" class="sem-resultados" hidden data-i18n="semResultados">Nenhum formato encontrado com estes filtros.</p>

        <!-- Lista com checkboxes, para selecionar formatos para o pedido -->
        <main id="listaFormatos" class="lista-formatos"></main>
      </section>

      <!--
      ============================================
      3.2 TAB "BIBLIOTECA DE FORMATOS"
      Só consulta: todos os formatos, sem checkboxes,
      com o link para a fonte oficial visível.
      ============================================
      -->
      <section id="tabSpecs" class="painel-tab" hidden>
        <p id="semResultadosSpecs" class="sem-resultados" hidden data-i18n="semResultados">Nenhum formato encontrado com estes filtros.</p>
        <main id="listaSpecs" class="lista-formatos"></main>
      </section>

    </div>
  </div>

  <!-- Biblioteca ExcelJS (ficheiro local, não precisa de internet) -->
  <script src="lib/exceljs.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
