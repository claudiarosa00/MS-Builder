<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MSBuilder — Materials Specs Builder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!--
  ============================================
  1. CABEÇALHO
  ============================================
  -->
  <header class="cabecalho">
    <h1>MSBuilder</h1>
    <p class="subtitulo">Materials Specs Builder</p>
  </header>

  <!--
  ============================================
  2. DADOS DA CAMPANHA (Cliente / Campanha)
  Estes dados vão identificar o pedido de materiais
  que a app vai gerar mais à frente. Por agora só
  são guardados e mostrados num resumo, para testar.
  ============================================
  -->
  <section class="dados-campanha">
    <div class="campo">
      <label for="campoCliente">Cliente</label>
      <input type="text" id="campoCliente" placeholder="Nome do cliente">
    </div>
    <div class="campo">
      <label for="campoCampanha">Campanha</label>
      <input type="text" id="campoCampanha" placeholder="Nome da campanha">
    </div>
  </section>

  <p id="resumoCampanha" class="resumo-campanha"></p>

  <!--
  ============================================
  3. RESUMO DA SELEÇÃO
  Mostra, sempre atualizado, quais os formatos que o
  utilizador já marcou nas checkboxes da lista abaixo.
  Fica fixo no topo (position: sticky) para não ser preciso
  voltar a subir a página depois de selecionar formatos
  mais abaixo na lista.
  ============================================
  -->
  <div class="barra-fixa">
    <aside id="resumoSelecao" class="resumo-selecao"></aside>
    <div id="areaExportar" class="area-exportar">
      <button id="botaoExportar" type="button" disabled>Exportar para Excel</button>
    </div>
  </div>

  <!--
  ============================================
  4. ÁREA DE ESTADO / MENSAGENS
  Usada para mostrar "A carregar..." ou erros,
  para percebermos sempre o que se está a passar.
  ============================================
  -->
  <section id="areaEstado" class="area-estado"></section>

  <!--
  ============================================
  5. LISTA DE FORMATOS (agrupada por publisher)
  Cada formato tem uma checkbox — selecionar/desselecionar
  atualiza automaticamente o "Resumo da seleção" acima.
  Pesquisa e filtros vêm numa próxima etapa.
  ============================================
  -->
  <main id="listaFormatos" class="lista-formatos"></main>

  <!-- Biblioteca ExcelJS (ficheiro local, não precisa de internet) -->
  <script src="lib/exceljs.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
